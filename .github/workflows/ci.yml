name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: docker image builds
        run: docker build -t wallet:ci .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start postgres, keycloak and localstack
        run: docker compose up -d --wait postgres keycloak localstack
      - name: integration tests
        run: go test -tags=integration -race -count=1 ./...
      - name: logs on failure
        if: failure()
        run: docker compose logs postgres keycloak localstack
