# Ambiente local: PostgreSQL, migrations, LocalStack (SQS), Keycloak (OIDC) e
# Jaeger (traces, UI em http://localhost:16686).
# Credenciais aqui são de DESENVOLVIMENTO LOCAL (ver .env.example).
#
#   docker compose up -d          # sobe tudo e aplica as migrations
#   docker compose down -v        # derruba e apaga os volumes

name: desafio-go-arqui

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      # só fica saudável depois que o script de papéis criou o banco "wallet"
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Aplica as migrations uma vez e termina. Roda como dono do schema.
  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://wallet_owner:wallet_owner@postgres:5432/wallet?sslmode=disable
      - up
    restart: "no"

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
      SQS_MAX_RECEIVE_COUNT: "5"
      SQS_VISIBILITY_TIMEOUT: "30"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - ./deploy/localstack/wager-transactions-policy.json:/etc/localstack/policies/wager-transactions-policy.json:ro
    healthcheck:
      # saudável só depois que o script de inicialização criou as filas
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    image: keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # emissor fixo: tokens obtidos por localhost:8081 ou por keycloak:8080
      # (de dentro da rede do compose) têm o mesmo "iss"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/realm-wallet.json:/opt/keycloak/data/import/realm-wallet.json:ro
    healthcheck:
      # a imagem não tem curl; usa /dev/tcp do bash na porta de gerenciamento
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40

  # Recebe os traces da API por OTLP/HTTP (4318) e os mostra na UI (16686).
  # Guarda em memória: some ao reiniciar.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  # API de carteiras. Sobe depois que as migrations terminaram com sucesso.
  app:
    build:
      context: .
      secrets: [extra_ca]
    image: desafio-go-arqui/wallet:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      INSTANCE_ID: app-1
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://wallet_app:wallet_app@postgres:5432/wallet?sslmode=disable
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 25s
      REFERENCE_WORKER_ENABLED: "true"
      # o emissor é o endereço público do Keycloak (o mesmo "iss" dos tokens
      # obtidos de fora); as chaves são buscadas pela rede interna do compose
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/wallet
      OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      OIDC_AUDIENCE: wallet-api
      # SQS (LocalStack). Na AWS: sem SQS_ENDPOINT e com credenciais do
      # papel da tarefa, nunca chaves fixas.
      SQS_ENABLED: "true"
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://localstack:4566
      SQS_ACCESS_KEY_ID: test
      SQS_SECRET_ACCESS_KEY: test
      SQS_INPUT_QUEUE: wager-transactions.fifo
      SQS_INPUT_DLQ: wager-transactions-dlq.fifo
      SQS_ALLOWED_PROVIDERS: provider-a,provider-b
      # publicador da outbox -> fila de eventos (usa a mesma conexão SQS)
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_QUEUE: wallet-events.fifo
      # traces -> Jaeger. Sem coletor no ar a API segue normalmente (os
      # spans são descartados depois de tentar exportar).
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${APP_PORT:-8080}:8080"
    # o compose espera até 30s pelo shutdown gracioso antes de matar
    stop_grace_period: 30s

volumes:
  pgdata:

secrets:
  # CA extra só para o build (proxy corporativo). Padrão: nenhum.
  extra_ca:
    file: ${EXTRA_CA_CERT:-/dev/null}
